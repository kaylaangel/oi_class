function noise(dur=.3,vol=.018,filterFreq=800){if(!soundOn)return;let ctx=sound(),len=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(.5+.5*Math.sin(Math.PI*i/len));let src=ctx.createBufferSource();src.buffer=buf;let filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=filterFreq;let g=ctx.createGain();g.gain.value=vol;src.connect(filter).connect(g).connect(ctx.destination);src.start();audioNodes.push(src)}

function playAmbience(){clearAudio();if(!soundOn)return;let mode=ambientMode||({fire:'fire',meadow:'birds',plane:'cloud',party:'party',mind:'calm',class:'calm'}[room]||'birds');ambientMode=mode;const run=()=>{if(!soundOn)return;if(mode==='fire'){noise(.33,.022,1100);if(Math.random()>.5)noise(.08,.013,2700)}else if(mode==='forest'){noise(.9,.013,380);if(Math.random()>.4)tone(750,.14,.012)}else if(mode==='birds'){noise(.75,.009,430);tone(1060+Math.random()*450,.10,.014);tone(1350+Math.random()*380,.13,.010,'sine',.16)}else if(mode==='cloud'){noise(1.4,.012,300);tone(330,.8,.008)}else if(mode==='calm'){for(const f of [261.6,329.6,392,523.2])tone(f,1.4,.010,'sine',(f%100)*.002)}else if(mode==='mission'){[130.8,196,261.6].forEach((f,i)=>tone(f,.33,.028,'triangle',i*.16));noise(.12,.018,900)}else if(mode==='party'){[220,293.7,329.6,392].forEach((f,i)=>tone(f,.20,.022,'triangle',i*.18));noise(.12,.021,1400)}};run();audioTimers.push(setInterval(run,mode==='party'?880:mode==='mission'?950:mode==='calm'?2500:mode==='birds'?1600:mode==='fire'?900:1600))}
$('#soundBtn').onclick=()=>{if(soundOn){soundOn=false;clearAudio();$('#soundBtn').textContent='🔇';$('#soundBtn').classList.remove('audio-on');showToast('🔇 소리를 껐어.')}else{enableSound(ambientMode||'birds');showToast('🔊 소리를 켰어.')}};
// Movement and touch controls
const keyDirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};window.addEventListener('keydown',e=>{if(!$('#modalWrap').hidden)return;const d=keyDirs[e.key];if(d){e.preventDefault();pressed.add(d)}});window.addEventListener('keyup',e=>{let d=keyDirs[e.key];if(d)pressed.delete(d)});window.addEventListener('blur',()=>pressed.clear());document.querySelectorAll('[data-d]').forEach(btn=>{let d=btn.dataset.d;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);pressed.add(d)});for(let event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>pressed.delete(d))});
let pointerX=0,pointerStart=0,orbit=0,tilt=0,zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{pointerX=e.clientX;pointerStart=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-pointerX)>12){orbit=Math.max(-.62,Math.min(.62,orbit+(e.clientX-pointerX)*.002));}});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.45,zoom+e.deltaY*.001))},{passive:false});
function animate(){requestAnimationFrame(animate);let dt=Math.min(.048,clock.getDelta()),time=clock.elapsedTime;for(let a of animated){if(a.kind==='flame'){a.obj.scale.y=.77+.23*Math.sin(time*7+a.phase);a.obj.position.y=a.y+.12*Math.sin(time*5+a.phase)}else if(a.kind==='float'){a.obj.position.y=a.y+.12*Math.sin(time*1.5+a.phase)}else if(a.kind==='spin'){a.obj.rotation.y+=dt*.65}else if(a.kind==='cloud'){a.obj.position.x=a.x+.35*Math.sin(time*.3+a.phase)}else if(a.kind==='ball'){let age=time-a.phase;a.obj.position.set(a.x-age*3.8,Math.max(.46,a.y+Math.sin(age*4)*.8),2.5-age*2);if(age>2.8)a.obj.visible=false}}for(let e of effects){e.m.position.y-=dt*e.v*2;e.m.rotation.z+=dt*e.spin;if(e.m.position.y<.22)e.m.visible=false}
 if(avatar){let dx=(pressed.has('right')?1:0)-(pressed.has('left')?1:0),dz=(pressed.has('down')?1:0)-(pressed.has('up')?1:0),moving=dx!==0||dz!==0;if(moving){let l=Math.hypot(dx,dz);dx/=l;dz/=l;avatar.position.x=Math.max(-8,Math.min(8,avatar.position.x+dx*dt*3.25));avatar.position.z=Math.max(-5.6,Math.min(8,avatar.position.z+dz*dt*3.25));avatarParts.body.rotation.y=Math.atan2(dx,dz)}else avatarParts.body.rotation.y+=(0-avatarParts.body.rotation.y)*dt*5;
 avatarParts.body.position.y=(moving?.06*Math.sin(time*16):.03*Math.sin(time*2.3));for(let i=0;i<2;i++){avatarParts.legs[i].rotation.x=moving?Math.sin(time*13+i*Math.PI)*.5:0;avatarParts.arms[i].rotation.x=moving?Math.sin(time*13+i*Math.PI)*.26:0;avatarParts.arms[i].rotation.z=0}
 if(time<actionUntil){if(pose==='wave'){avatarParts.arms[1].rotation.z=-.9+Math.sin(time*14)*.25}else if(pose==='sit'){avatarParts.body.position.y=-.38;avatarParts.legs.forEach(l=>l.rotation.x=-.95)}else if(pose==='sleep'){avatarParts.body.rotation.z=.65;avatarParts.body.position.y=-.3}else if(pose==='yoga'){avatarParts.arms[0].rotation.z=2.3;avatarParts.arms[1].rotation.z=-2.3}else if(pose==='dance'){avatarParts.body.rotation.z=Math.sin(time*8)*.22;avatarParts.arms[0].rotation.z=1.5*Math.sin(time*7);avatarParts.arms[1].rotation.z=-1.5*Math.sin(time*7)}else if(pose==='cheer'){avatarParts.arms[0].rotation.z=2.4;avatarParts.arms[1].rotation.z=-2.4}else if(pose==='throw'||pose==='roast'){avatarParts.arms[1].rotation.z=-1.1;avatarParts.arms[1].rotation.x=-.9}else if(pose==='run'){avatarParts.body.position.y=.16*Math.abs(Math.sin(time*13));avatarParts.arms[0].rotation.x=Math.sin(time*13);avatarParts.arms[1].rotation.x=-Math.sin(time*13)}}else{pose='';avatarParts.body.rotation.z=0}
 }
 let cx=17*Math.cos(orbit)-20*Math.sin(orbit),cz=17*Math.sin(orbit)+20*Math.cos(orbit);camera.position.lerp(new THREE.Vector3(cx*zoom,12*zoom,cz*zoom),dt*2.8);camera.lookAt(0,1.3,0);renderer.render(scene,camera)}requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
